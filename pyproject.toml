[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtdash"
version = "1.0.0"
description = "Gera, previsualiza e publica dashboards da plataforma Dynatrace a partir de uma descricao em linguagem natural"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["dynatrace", "dashboard", "grail", "dql", "observability"]
dependencies = []

[project.scripts]
dtdash = "dtdash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtdash = ["webui/*.html", "webui/*.css", "webui/*.js"]
